<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Follow-Up Ghost 👻</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3;
          --muted:#8b949e; --accent:#a371f7; --red:#f85149; --amber:#d29922; --green:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; } h1 span { color:var(--accent); }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px;
          padding:10px 16px; min-width:100px; }
  .stat b { font-size:1.3rem; display:block; }
  .stat.red b{color:var(--red)} .stat.amber b{color:var(--amber)} .stat.green b{color:var(--green)}
  textarea { width:100%; min-height:110px; background:var(--card); color:var(--fg);
             border:1px solid var(--border); border-radius:10px; padding:12px; font:inherit; resize:vertical; }
  button { cursor:pointer; border:none; border-radius:8px; padding:10px 18px;
           font-weight:600; font-size:.95rem; }
  .primary { background:var(--accent); color:#fff; margin-top:10px; }
  .primary:disabled { opacity:.5; cursor:wait; }
  h2 { margin-top:32px; font-size:1.05rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .card { background:var(--card); border:1px solid var(--border); border-left:4px solid var(--muted);
          border-radius:10px; padding:14px 16px; margin:10px 0; }
  .card.overdue { border-left-color:var(--red); }
  .card.soon { border-left-color:var(--amber); }
  .card.done { border-left-color:var(--green); opacity:.6; }
  .task { font-weight:600; }
  .done .task { text-decoration:line-through; }
  .meta { color:var(--muted); font-size:.85rem; margin-top:4px; }
  .src { color:var(--muted); font-size:.8rem; font-style:italic; margin-top:6px;
         border-top:1px dashed var(--border); padding-top:6px; }
  .actions { margin-top:8px; display:flex; gap:8px; }
  .actions button { padding:6px 12px; font-size:.8rem; background:var(--border); color:var(--fg); }
  .actions .ok { background:var(--green); color:#04150a; }
  .err { color:var(--red); margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Follow-Up <span>Ghost</span> 👻</h1>
  <p>Paste an email, message, or meeting notes — or just <b>forward any email</b> to
     <a style="color:var(--accent)" href="mailto:samiullah-4993@agentmail.to">samiullah-4993@agentmail.to</a>.
     The ghost extracts every commitment, emails you before it's due, and closes the loop when you reply "DONE".</p>

  <div class="insights" id="insights" style="display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px;color:var(--muted);font-size:.85rem"></div>

  <div class="stats" id="stats"></div>

  <textarea id="input" placeholder='e.g. "Hey Sami, can you send me the Q3 report by Thursday? I will review the budget draft and get back to you Friday."'></textarea>
  <input id="email" type="email" placeholder="your@email.com — nudge emails go here (saved in this browser)"
         style="width:100%;margin-top:8px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font:inherit" />
  <button class="primary" id="extractBtn" onclick="extract()">Extract commitments</button>
  <div class="err" id="err"></div>

  <h2>Commitments</h2>
  <div id="list"></div>
</div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dstr = (d) => d ? String(d).slice(0, 10) : null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

async function loadStats() {
  const s = await api('/api/stats');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${s.pending}</b>Pending</div>
    <div class="stat red"><b>${s.overdue}</b>Overdue</div>
    <div class="stat amber"><b>${s.due_soon}</b>Due soon</div>
    <div class="stat green"><b>${s.completed}</b>Completed</div>`;
  try {
    const i = await api('/api/insights');
    if (i.total) {
      document.getElementById('insights').innerHTML =
        `👻 <b style="color:var(--accent)">${i.completion_rate ?? 0}%</b> completion rate` +
        ` · <b>${i.nudges_sent}</b> nudge emails sent` +
        (i.most_tracked_owner ? ` · most tracked: <b>${esc(i.most_tracked_owner)}</b>` : '');
    }
  } catch {}
}

async function load() {
  const items = await api('/api/commitments');
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('list').innerHTML = items.map((c) => {
    const due = dstr(c.due_date);
    const done = c.status === 'completed';
    const cls = done ? 'done' : due && due < today ? 'overdue' : due && due <= addDays(today, 3) ? 'soon' : '';
    return `<div class="card ${cls}">
      <div class="task">${esc(c.task)}</div>
      <div class="meta">👤 ${esc(c.owner)}${c.owner_email ? ` &lt;<a style="color:var(--accent)" href="mailto:${esc(c.owner_email)}">${esc(c.owner_email)}</a>&gt;` : ''} ${due ? '· 📅 ' + due : '· no deadline'}
        ${!done && due && due < today ? '· <b style="color:var(--red)">OVERDUE</b>' : ''}</div>
      ${c.source_text ? `<div class="src">“${esc(c.source_text)}”</div>` : ''}
      <div class="actions">
        ${!done ? `<button class="ok" onclick="complete(${c.id})">✓ Complete</button>` : ''}
        <button onclick="del(${c.id})">Delete</button>
      </div>
    </div>`;
  }).join('') || '<p style="color:var(--muted)">Nothing tracked yet. The ghost is bored.</p>';
  loadStats();
}

function addDays(iso, n) {
  const d = new Date(iso); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

async function extract() {
  const btn = document.getElementById('extractBtn');
  const err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Ghost is reading…';
  try {
    const text = document.getElementById('input').value;
    const default_email = document.getElementById('email').value.trim() || null;
    if (default_email) localStorage.setItem('ghost_email', default_email);
    const r = await api('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, default_email }),
    });
    if (!r.extracted) err.textContent = 'No commitments found in that text.';
    document.getElementById('input').value = '';
    await load();
  } catch (e) { err.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = 'Extract commitments'; }
}

async function complete(id) {
  await api(`/api/commitments/${id}/complete`, { method: 'POST' });
  load();
}
async function del(id) {
  await api(`/api/commitments/${id}`, { method: 'DELETE' });
  load();
}
document.getElementById('email').value = localStorage.getItem('ghost_email') || '';
load();
</script>

</html>
